<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnStack — Courses</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">LearnStack</div>
    <div id="auth-controls">
      <button id="open-auth-btn" type="button" class="btn btn-primary">Sign In / Sign Up</button>
    </div>
  </header>

  <main class="container">
    <p id="status-banner" class="banner hidden"></p>

    <section>
      <h2>Available Courses</h2>
      <div id="course-grid" class="grid"></div>
    </section>

    <section id="lesson-viewer" class="lesson-box hidden">
      <h3 id="lesson-title"></h3>
      <p id="lesson-content"></p>
    </section>
  </main>

  <div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="modal-card">
      <h3 id="auth-title">Sign In</h3>
      <form id="auth-form">
        <label class="sr-only" for="email">Email address</label>
        <input type="email" id="email" placeholder="Email address" autocomplete="email" required />

        <label class="sr-only" for="password">Password</label>
        <input type="password" id="password" placeholder="Password (min 6 chars)" minlength="6" autocomplete="current-password" required />

        <p id="auth-error" class="error"></p>
        <button type="submit" class="btn btn-primary full-width">Continue</button>
      </form>
      <p class="switch-text">
        <span id="auth-switch-label">Don't have an account?</span>
        <a href="#" id="toggle-auth-mode">Sign Up</a>
      </p>
      <button id="close-auth-btn" type="button" class="btn btn-ghost full-width">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
